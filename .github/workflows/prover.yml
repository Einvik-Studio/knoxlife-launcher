# Prøvene for launcheren og agenten på Windows, Linux og Mac. Repoet er offentlig, så kjøringene koster ingenting.
name: Prøvene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcheren:
    name: Launcheren (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  vinduet:
    name: Vinduet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      # Vinduet på Linux bruker WebKitGTK; Windows (WebView2) og Mac (WKWebView) har det innebygd.
      - name: Bibliotekene til vinduet (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: rustup component add clippy
      - run: cargo test --locked -p knoxlife-launcher
      - run: cargo clippy --locked -p knoxlife-launcher --all-targets -- -D warnings
      - run: cargo build --locked --release -p knoxlife-launcher

  agenten:
    name: Agenten (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Bygg agenten og kjør prøvene
        shell: bash
        run: java/agent/bygg.sh
      - name: SHA-256 av agenten
        shell: bash
        run: sha256sum java/agent/ut/knoxlife-agent.jar
